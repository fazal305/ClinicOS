<html lang="en">
  <head>
    <meta charset="UTF-8" />

      name="description"
      content="ClinicOS is a portfolio/educational clinic management system for small-to-medium medical clinics — patient registration, appointment scheduling, clinical records, prescriptions, and payments, with role-based access. Built with React, Express, and MySQL. All data is fictional demo data."

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

      content="A portfolio/educational clinic management system for small-to-medium medical clinics — patient registration, appointment scheduling, clinical records, prescriptions, and payments, with role-based access. All data is fictional demo data."
    />
    <script>
      // Applied before paint to avoid a light/dark flash on load.
      (function () {
        var stored = localStorage.getItem('clinicos-theme');
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
