services:
  mysql:
    image: mysql:8.0
    container_name: clinicos-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: clinicos
      MYSQL_USER: clinicos_app
      MYSQL_PASSWORD: dev_password_change_me
      MYSQL_ROOT_PASSWORD: dev_root_password_change_me
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdev_root_password_change_me"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: clinicos-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql-data:
